<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel Mercado Libre — Rentabilidad</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M8 21l5-7 4 4 7-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">ML</div>
        <div class="brand-text">
          <b>Panel de rentabilidad</b>
          <span>Mercado Libre Argentina</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="conn-foot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn ghost menu-btn" id="menu-btn" aria-label="Menú">☰</button>
        <div>
          <h1 id="view-title">Dashboard</h1>
          <div class="sub" id="view-sub"></div>
        </div>
        <div class="spacer"></div>
        <div class="controls" id="period-controls"></div>
        <button class="btn ghost" id="salir-btn" title="Salir">Salir</button>
        <button class="btn ghost" id="print-btn" title="Imprimir o guardar en PDF">⎙</button>
        <button class="btn ghost" id="theme-btn" title="Cambiar tema">◐</button>
        <button class="btn" id="refresh-btn" title="Actualizar datos">↻</button>
      </header>
      <div id="print-head" class="solo-impresion"></div>
      <main class="content" id="content">
        <div class="loading">Cargando…</div>
      </main>
    </div>
  </div>

  <div class="tip" id="tip"></div>
  <div id="modal-root"></div>

  <!-- ===================== ENTRADA ===================== -->
  <div id="nube-login" style="max-width:360px;margin:12vh auto;padding:0 16px">
    <div class="card card-pad">
      <h1 style="font-size:19px;margin:0 0 4px">Panel de rentabilidad</h1>
      <div class="note" style="margin-bottom:18px">Entrá con tu usuario para ver los números.</div>
      <form id="nube-form">
        <label style="display:block;margin-bottom:12px;font-size:13px">Mail
          <input type="email" id="nube-mail" autocomplete="username" required style="width:100%;margin-top:4px">
        </label>
        <label style="display:block;margin-bottom:12px;font-size:13px">Contraseña
          <input type="password" id="nube-pass" autocomplete="current-password" required style="width:100%;margin-top:4px">
        </label>
        <button class="btn primary" type="submit" id="nube-entrar" style="width:100%">Entrar</button>
        <div id="nube-err" style="color:var(--bad,#d03b3b);font-size:13px;margin-top:10px;min-height:18px"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { entrar, haySesion, salir } from './js/api.js';
    const login = document.getElementById('nube-login');
    const app = document.getElementById('app');
    const err = document.getElementById('nube-err');
    app.style.display = 'none';

    async function arrancar() {
      login.style.display = 'none';
      app.style.display = '';
      await import('./js/app.js');
      const b = document.getElementById('salir-btn');
      if (b) b.addEventListener('click', salir);
    }

    document.getElementById('nube-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('nube-entrar');
      btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
      try {
        await entrar(document.getElementById('nube-mail').value.trim(), document.getElementById('nube-pass').value);
        document.getElementById('nube-pass').value = '';
        await arrancar();
      } catch (e2) {
        err.textContent = e2.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    if (haySesion()) arrancar();
  </script>
</body>
</html>
