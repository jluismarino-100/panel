<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Mercado Libre</title>
<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --serie:#2a78d6; --bueno:#006300; --malo:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --serie:#3987e5; --bueno:#0ca30c; --malo:#d03b3b;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --serie:#3987e5; --bueno:#0ca30c; --malo:#d03b3b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--plane); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  .wrap{max-width:1180px; margin:0 auto; padding:16px}
  h1{font-size:19px; margin:0; letter-spacing:-.02em}
  h2{font-size:14px; margin:26px 0 10px; letter-spacing:-.01em}
  .sub{font-size:12.5px; color:var(--ink-2); margin-top:3px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px}
  .pad{padding:15px 17px}
  .top{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .top .sp{flex:1 1 auto}
  button{
    font:inherit; font-size:13.5px; padding:8px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
  }
  button.p{background:var(--serie); border-color:var(--serie); color:#fff}
  button:disabled{opacity:.55; cursor:default}
  input{
    font:inherit; width:100%; padding:10px 12px; margin-top:4px; border-radius:8px;
    border:1px solid var(--axis); background:var(--surface); color:var(--ink);
  }
  label{display:block; margin-bottom:12px; font-size:13px; color:var(--ink-2)}

  /* ----- login ----- */
  #login{max-width:360px; margin:12vh auto}
  #login .pad{padding:22px}
  #err{color:var(--malo); font-size:13px; margin-top:10px; min-height:18px}

  /* ----- tarjetas de número ----- */
  .kpis{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .kpi .lab{font-size:12px; color:var(--ink-2)}
  .kpi .val{font-size:23px; font-weight:650; letter-spacing:-.02em; margin-top:3px}
  .kpi .hint{font-size:11.5px; color:var(--muted); margin-top:2px}

  /* ----- gráficos ----- */
  .charts{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .chart{position:relative}
  svg{display:block; width:100%; height:auto; overflow:visible}
  .gl{stroke:var(--grid); stroke-width:1}
  .ax{fill:var(--muted); font-size:10px}
  .bar{fill:var(--serie)}
  .bar:hover{opacity:.78}
  .tip{
    position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.14); white-space:nowrap; z-index:5;
  }

  /* ----- tablas ----- */
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--grid); white-space:nowrap}
  th{font-size:11.5px; color:var(--ink-2); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
  td.t{white-space:normal; min-width:200px; max-width:380px}
  tbody tr:last-child td{border-bottom:0}
  .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); color:var(--ink-2)}
  .aviso{font-size:12.5px; color:var(--ink-2); margin-top:10px}
  .oculto{display:none}
  @media (max-width:560px){
    .wrap{padding:12px}
    .kpi .val{font-size:20px}
    th,td{padding:7px 8px}
  }
</style>
</head>
<body>

<!-- =================== LOGIN =================== -->
<div id="login" class="card">
  <div class="pad">
    <h1>Panel Mercado Libre</h1>
    <div class="sub" style="margin-bottom:18px">Entrá con tu usuario para ver los números.</div>
    <form id="form-login">
      <label>Mail
        <input type="email" id="mail" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input type="password" id="pass" autocomplete="current-password" required>
      </label>
      <button class="p" type="submit" id="btn-entrar" style="width:100%">Entrar</button>
      <div id="err"></div>
    </form>
  </div>
</div>

<!-- =================== PANEL =================== -->
<div id="panel" class="wrap oculto">
  <div class="top">
    <div>
      <h1>Panel Mercado Libre</h1>
      <div class="sub" id="cuando">cargando…</div>
    </div>
    <div class="sp"></div>
    <button id="btn-tema" title="Cambiar entre claro y oscuro">◐</button>
    <button id="btn-salir">Salir</button>
  </div>

  <div id="contenido"></div>
</div>

<script>
const SUPABASE_URL = 'https://bwbwttwikfizocgkfunx.supabase.co';
const SUPABASE_ANON = 'sb_publishable_n0OxxHgMvSP990vrfa_myg_s1zFRtFX';

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const money = (v) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '—' : '$' + nf.format(Math.round(Number(v)));
const numero = (v) => (v === null || v === undefined) ? '—' : nf.format(Number(v));
const fechaCorta = (d) => { try { return new Date(d + 'T12:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }); } catch { return d; } };
const fechaLarga = (d) => { try { return new Date(d).toLocaleString('es-AR'); } catch { return d; } };

const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const borrar = (k) => { try { localStorage.removeItem(k); } catch {} };

// ---------- tema ----------
(function tema() {
  const t = leer('tema');
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
$('#btn-tema').onclick = () => {
  const oscuro = getComputedStyle(document.body).backgroundColor === 'rgb(13, 13, 13)';
  const nuevo = oscuro ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nuevo);
  guardar('tema', nuevo);
};

// ---------- sesión ----------
let token = leer('token');

async function entrar(email, password) {
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, 'content-type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = String(j.error_description || j.msg || j.message || '');
    if (/invalid login/i.test(m)) throw new Error('Mail o contraseña incorrectos.');
    if (/not confirmed/i.test(m)) throw new Error('El usuario está sin confirmar. Pedí que lo confirmen en Supabase.');
    throw new Error(m || 'No pude entrar.');
  }
  token = j.access_token;
  guardar('token', token);
  return token;
}

function salir() {
  borrar('token');
  token = null;
  $('#panel').classList.add('oculto');
  $('#login').classList.remove('oculto');
}
$('#btn-salir').onclick = salir;

/** Lee una tabla. Trae de a 1000 filas hasta terminar. */
async function tabla(nombre, { select = '*', orden = null, limite = 5000 } = {}) {
  const filas = [];
  let desde = 0;
  while (filas.length < limite) {
    const q = new URLSearchParams({ select });
    if (orden) q.set('order', orden);
    const hasta = desde + 999;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${nombre}?${q}`, {
      headers: {
        apikey: SUPABASE_ANON,
        authorization: 'Bearer ' + token,
        range: `${desde}-${hasta}`,
        'range-unit': 'items',
      },
    });
    if (r.status === 401 || r.status === 403) { const e = new Error('Tu sesión venció. Entrá de nuevo.'); e.vencido = true; throw e; }
    if (!r.ok) throw new Error(`No pude leer ${nombre} (${r.status}).`);
    const lote = await r.json();
    filas.push(...lote);
    if (lote.length < 1000) break;
    desde += 1000;
  }
  return filas;
}

// ---------- gráfico de barras, una sola serie ----------
function barras(cont, { datos, valor, etiqueta, titulo, formato = money }) {
  if (!datos.length) { cont.innerHTML = `<div class="pad"><h3 style="margin:0;font-size:13.5px">${esc(titulo)}</h3><div class="aviso">Sin datos.</div></div>`; return; }
  const W = 560, H = 190, mI = 8, mD = 8, mS = 14, mB = 24;
  const max = Math.max(...datos.map(valor), 0) || 1;
  const anchoUtil = W - mI - mD;
  const paso = anchoUtil / datos.length;
  const ancho = Math.max(1, paso - 2); // 2px de aire entre barras
  const alturaUtil = H - mS - mB;

  // 3 líneas de referencia
  const lineas = [0, 0.5, 1].map((f) => ({ y: mS + alturaUtil * (1 - f), v: max * f }));

  const barrasSvg = datos.map((d, i) => {
    const v = valor(d) || 0;
    const h = Math.max(v > 0 ? 2 : 0, (v / max) * alturaUtil);
    const x = mI + i * paso;
    const y = mS + alturaUtil - h;
    return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ancho.toFixed(1)}" height="${h.toFixed(1)}" rx="3"
              data-i="${i}"><title></title></rect>`;
  }).join('');

  const cadaCuantas = Math.ceil(datos.length / 6);
  const ticks = datos.map((d, i) => (i % cadaCuantas === 0
    ? `<text class="ax" x="${(mI + i * paso + ancho / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(etiqueta(d))}</text>` : '')).join('');

  cont.innerHTML = `
    <div class="pad" style="padding-bottom:6px">
      <h3 style="margin:0;font-size:13.5px">${esc(titulo)}</h3>
      <div class="sub">máximo del período: ${formato(max)}</div>
    </div>
    <div class="chart">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(titulo)}">
        ${lineas.map((l) => `<line class="gl" x1="${mI}" x2="${W - mD}" y1="${l.y.toFixed(1)}" y2="${l.y.toFixed(1)}"/>`).join('')}
        ${barrasSvg}
        ${ticks}
      </svg>
      <div class="tip"></div>
    </div>`;

  const tip = cont.querySelector('.tip');
  const chart = cont.querySelector('.chart');
  chart.addEventListener('pointermove', (e) => {
    const r = e.target.closest('.bar');
    if (!r) { tip.style.opacity = 0; return; }
    const d = datos[Number(r.dataset.i)];
    tip.innerHTML = `<b>${esc(etiqueta(d))}</b> · ${formato(valor(d))}`;
    const caja = chart.getBoundingClientRect();
    tip.style.opacity = 1;
    tip.style.left = Math.min(Math.max(8, e.clientX - caja.left - tip.offsetWidth / 2), caja.width - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(0, e.clientY - caja.top - tip.offsetHeight - 10) + 'px';
  });
  chart.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
}

// ---------- armado del panel ----------
function kpi(lab, val, hint) {
  return `<div class="card pad kpi"><div class="lab">${esc(lab)}</div><div class="val">${val}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`;
}

async function cargar() {
  const cont = $('#contenido');
  cont.innerHTML = '<div class="card pad">Cargando datos…</div>';

  const [sync] = await tabla('ml_sync');
  const ventas = await tabla('ml_sales', { orden: 'sold_at.desc' });
  const publicaciones = await tabla('ml_listings');
  const ads = await tabla('ml_ads_daily', { orden: 'day.asc' });

  const t = sync?.totals || {};
  $('#cuando').textContent = sync
    ? `Datos subidos el ${fechaLarga(sync.synced_at)} · período ${sync.period_from} → ${sync.period_to}`
    : 'Todavía no se subió ningún dato desde la fábrica.';

  // --- facturación por día, a partir de las ventas ---
  const porDia = new Map();
  for (const v of ventas) porDia.set(v.sold_at, (porDia.get(v.sold_at) || 0) + Number(v.gross_revenue || 0));
  const dias = [...porDia.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([day, total]) => ({ day, total }));

  // --- ranking de publicaciones por facturación del período ---
  const porItem = new Map();
  for (const v of ventas) {
    const k = v.item_id || v.sku || 'sin-id';
    const a = porItem.get(k) || { item_id: v.item_id, titulo: v.title, sku: v.sku, unidades: 0, facturacion: 0, publicidad: 0 };
    a.unidades += Number(v.quantity || 1);
    a.facturacion += Number(v.gross_revenue || 0);
    a.publicidad += Number(v.advertising || 0);
    porItem.set(k, a);
  }
  const porId = new Map(publicaciones.map((p) => [p.item_id, p]));
  const ranking = [...porItem.values()].sort((a, b) => b.facturacion - a.facturacion).slice(0, 40);

  const seLlevaMl = (Number(t.commission) || 0) + (Number(t.shipping) || 0) + (Number(t.financing) || 0) + (Number(t.other) || 0);

  cont.innerHTML = `
    <div class="kpis">
      ${kpi('Facturación', money(t.grossRevenue), `${numero(t.orders)} órdenes · ${numero(t.units)} unidades`)}
      ${kpi('Ticket promedio', money(t.avgTicket), 'por orden')}
      ${kpi('Se lleva Mercado Libre', money(seLlevaMl), t.totalPaidToMlPct ? `comisión, envío y cargos` : '')}
      ${kpi('Publicidad', money(t.advertising), t.adsPctOfRevenue ? `${String(t.adsPctOfRevenue).replace('.', ',')}% de la facturación` : '')}
      ${kpi('Neto recibido', money(t.netReceived), 'lo que deposita Mercado Libre')}
      ${kpi('Publicaciones activas', numero(t.listingsActive), `de ${numero(t.listingsTotal)} en total`)}
    </div>
    ${t.profitKnown === false ? `<div class="card pad aviso" style="margin-top:12px">
      <b>Ojo:</b> la ganancia y el margen no aparecen porque faltan costos de producto cargados en el panel de la fábrica.
      Los números de arriba son facturación y cargos, no ganancia.
    </div>` : ''}

    <h2>Día a día</h2>
    <div class="charts">
      <div class="card" id="g-fact"></div>
      <div class="card" id="g-ads"></div>
    </div>

    <h2>Publicaciones que más facturaron</h2>
    <div class="card scroll">
      <table>
        <thead><tr>
          <th>Publicación</th><th>SKU</th><th class="n">Unidades</th><th class="n">Facturación</th>
          <th class="n">Publicidad</th><th class="n">Precio hoy</th><th class="n">Stock</th><th>Estado</th>
        </tr></thead>
        <tbody>
          ${ranking.map((r) => {
            const p = porId.get(r.item_id) || {};
            return `<tr>
              <td class="t">${p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener" style="color:inherit">${esc(r.titulo || '—')}</a>` : esc(r.titulo || '—')}</td>
              <td>${esc(r.sku || '—')}</td>
              <td class="n">${numero(r.unidades)}</td>
              <td class="n">${money(r.facturacion)}</td>
              <td class="n">${r.publicidad ? money(r.publicidad) : '—'}</td>
              <td class="n">${money(p.price)}</td>
              <td class="n">${numero(p.stock)}</td>
              <td><span class="tag">${esc(p.status || '—')}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <h2>Últimas ventas</h2>
    <div class="card scroll">
      <table>
        <thead><tr>
          <th>Fecha</th><th>Publicación</th><th class="n">Cant.</th><th class="n">Cobrado</th>
          <th class="n">Comisión</th><th class="n">Envío</th><th class="n">Neto</th>
        </tr></thead>
        <tbody>
          ${ventas.slice(0, 60).map((v) => `<tr>
            <td>${fechaCorta(v.sold_at)}</td>
            <td class="t">${esc(v.title || v.item_id || '—')}</td>
            <td class="n">${numero(v.quantity)}</td>
            <td class="n">${money(v.gross_revenue)}</td>
            <td class="n">${money(v.commission)}</td>
            <td class="n">${money(v.shipping)}</td>
            <td class="n">${money(v.net_received)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="pad aviso">Se muestran las 60 más recientes de ${numero(ventas.length)}.</div>
    </div>

    <div class="aviso" style="margin:26px 0 40px">
      Esta página <b>solo lee</b>. Desde acá no se puede cambiar nada, ni en el panel ni en Mercado Libre.
      Los datos se actualizan cuando se suben desde la computadora de la fábrica.
    </div>`;

  barras($('#g-fact'), { datos: dias, valor: (d) => d.total, etiqueta: (d) => fechaCorta(d.day), titulo: 'Facturación por día' });
  barras($('#g-ads'), { datos: ads, valor: (d) => Number(d.cost || 0), etiqueta: (d) => fechaCorta(d.day), titulo: 'Publicidad por día' });
}

async function mostrarPanel() {
  $('#login').classList.add('oculto');
  $('#panel').classList.remove('oculto');
  try {
    await cargar();
  } catch (e) {
    if (e.vencido) { salir(); $('#err').textContent = e.message; return; }
    $('#contenido').innerHTML = `<div class="card pad"><b>No pude traer los datos.</b><div class="aviso">${esc(e.message)}</div></div>`;
  }
}

$('#form-login').onsubmit = async (e) => {
  e.preventDefault();
  const b = $('#btn-entrar');
  b.disabled = true; b.textContent = 'Entrando…'; $('#err').textContent = '';
  try {
    await entrar($('#mail').value.trim(), $('#pass').value);
    $('#pass').value = '';
    await mostrarPanel();
  } catch (err) {
    $('#err').textContent = err.message;
  } finally {
    b.disabled = false; b.textContent = 'Entrar';
  }
};

if (token) mostrarPanel();
</script>
</body>
</html>
